algo: tppo
single: true
envparameters:
  action_continuous: true
  action_space: 1
  n_player: 1
  obs_continuous: true
  obs_space: 9
  action_interval: 1
  action_max: 20.0  #WASTED
  action_max_0: 1.0
  action_max_1: 0.3
  mlp: false
  boots_num: 4
scenario: iff
hyperparameters:
  mode: 'separate_Q'
  sigma_type: 'share'  #share or variable
  n_ensemble: 8
  load_pretrained: false
  load_actor: true
  load_critic: true
  cls: false
  batch_size: 256
  offline_batch_size: 1600
  buffer_capacity: 10000
  c_lr: 0.0003 #0.005
  a_lr: 0.0001
  q_lr: 0.001 #0.0005
  context_len: 40
  n_layer: 2
  n_head: 2  #2
  n_embed: 32  #32
  gamma: 0.99
  ppo_epoch: 8
  ppo_clip: 0.2
  ppo_entropy: 0.01
  grad_norm_clip: 0.5
  gae_lambda: 0.95
  St: 0.2
  AD: 0.1
  theta: 70
  Phi: 190
  is_double_q: false #IQL
  sa_type: 'separate' #'separate' or 'concat'
  omega: 0.8
  target_update_freq: 4
  tau: 0.005
